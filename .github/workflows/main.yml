name: Crypto Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installa le librerie
        run: pip install requests yfinance
        
      - name: Esegui il bot
        run: python bot.py
